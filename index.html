<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Apeiron</title>
<style>
:root{
  --bg:#04050d; --ink:#e7eaff; --dim:#929ac8; --faint:#5a628f;
  --q:#7fe3ff; --sh:#c49bff; --es:#ffd27a; --ok:#6ef2b4; --bad:#ff7b8b;
  --qr:127,227,255; --shr:196,155,255; --esr:255,210,122;
  --neb1:rgba(90,70,200,.22); --neb2:rgba(40,140,200,.14); --neb3:rgba(160,80,220,.12);
  --glass:rgba(12,16,36,.74); --glass2:rgba(20,26,58,.82);
  --edge:rgba(130,160,255,.16); --edge2:rgba(130,160,255,.34); --c:rgba(150,190,255,.55);
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:64px;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 500px at 15% -10%,var(--neb1),transparent 70%),
  radial-gradient(800px 500px at 100% 20%,var(--neb2),transparent 70%),
  radial-gradient(700px 600px at 50% 120%,var(--neb3),transparent 70%)}
.num,.res .v,.res .r{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:rgba(var(--shr),.35)}
/* nothing in the game can be highlighted, except the save box and text inputs */
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}
img,canvas{-webkit-user-drag:none}
/* HUD frame: thin edge + glowing corner brackets */
.hud,.row,.card,.info,.chal,.ach,.auto-box,.tut,.feed,#modal .box{
  --c:rgba(150,190,255,.5);
  background:
    linear-gradient(var(--c) 0 0) top left/12px 1.5px no-repeat,linear-gradient(var(--c) 0 0) top left/1.5px 12px no-repeat,
    linear-gradient(var(--c) 0 0) top right/12px 1.5px no-repeat,linear-gradient(var(--c) 0 0) top right/1.5px 12px no-repeat,
    linear-gradient(var(--c) 0 0) bottom left/12px 1.5px no-repeat,linear-gradient(var(--c) 0 0) bottom left/1.5px 12px no-repeat,
    linear-gradient(var(--c) 0 0) bottom right/12px 1.5px no-repeat,linear-gradient(var(--c) 0 0) bottom right/1.5px 12px no-repeat,
    var(--glass);
  border:1px solid var(--edge);border-radius:3px;backdrop-filter:blur(6px)}
#topbar{position:sticky;top:0;z-index:10}
header{background:linear-gradient(180deg,rgba(6,8,20,.94),rgba(6,8,20,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--edge);padding:10px 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(var(--qr),.08),0 8px 30px rgba(0,0,0,.35)}
.title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.32em;font-size:13px;color:#cfd6ff;text-shadow:0 0 12px rgba(160,180,255,.5)}
.title .orb{width:22px;height:22px}
.res{display:flex;flex-direction:column;min-width:140px;padding-left:12px;border-left:2px solid var(--edge2)}
.res .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--faint)}
.res .v{font-size:21px;font-weight:700;line-height:1.2}
.res .r{font-size:11.5px;color:var(--dim)}
.res.q{border-left-color:rgba(var(--qr),.6)}.res.q .v{color:var(--q);text-shadow:0 0 16px rgba(var(--qr),.45)}
.res.sh{border-left-color:rgba(var(--shr),.6)}.res.sh .v{color:var(--sh);text-shadow:0 0 16px rgba(var(--shr),.45)}
.res.es{border-left-color:rgba(var(--esr),.6)}.res.es .v{color:var(--es);text-shadow:0 0 16px rgba(var(--esr),.45)}
.spacer{flex:1}
.prestige{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:linear-gradient(180deg,rgba(40,50,100,.55),rgba(20,26,58,.75));border:1px solid var(--edge2);border-radius:3px;padding:6px 13px;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s,transform .06s;letter-spacing:.02em}
button:hover:not(:disabled){border-color:rgba(160,190,255,.7);box-shadow:0 0 12px rgba(127,170,255,.25)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:default}
button.can{border-color:var(--q);box-shadow:0 0 10px rgba(var(--qr),.22),inset 0 0 12px rgba(var(--qr),.08);color:#eaffff}
.btn-big{padding:7px 18px;font-weight:700;line-height:1.2;text-align:center;min-width:160px;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;position:relative;overflow:hidden}
.btn-big small{display:block;font-weight:500;font-size:11px;opacity:.9;letter-spacing:.02em;text-transform:none;font-family:var(--mono)}
.btn-big:not(:disabled)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.btn-collapse{border-color:var(--sh)!important;color:#f0e6ff;background:linear-gradient(180deg,rgba(110,70,200,.55),rgba(40,22,80,.85))!important;box-shadow:0 0 16px rgba(var(--shr),.3)}
.btn-ascend{border-color:var(--es)!important;color:#fff4dc;background:linear-gradient(180deg,rgba(170,120,30,.55),rgba(60,40,10,.85))!important;box-shadow:0 0 16px rgba(var(--esr),.3)}
.btn-chal{border-color:var(--bad)!important;color:#ffe3e6;background:linear-gradient(180deg,rgba(160,40,60,.55),rgba(60,14,24,.85))!important}
nav{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--edge);flex-wrap:wrap;background:rgba(6,8,20,.94);backdrop-filter:blur(8px)}
nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--dim);padding:10px 14px 9px;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:600}
nav button .ico{margin-right:7px;opacity:.8}
nav button:hover:not(:disabled){box-shadow:none;color:var(--ink);border-bottom-color:rgba(160,190,255,.35)}
nav button.active{color:#fff;border-bottom-color:var(--q);text-shadow:0 0 10px rgba(var(--qr),.6);background:linear-gradient(0deg,rgba(var(--qr),.1),transparent)}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--q);margin-left:7px;vertical-align:middle;box-shadow:0 0 8px var(--q);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
main{max-width:1140px;margin:0 auto;padding:18px 20px}
.tab{display:none}.tab.active{display:block;animation:tabin .25s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(4px)}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:3px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;border-right:1px solid var(--edge2);font-size:12.5px}
.seg button:last-child{border-right:none}
.seg button.on{background:rgba(var(--qr),.16);color:#fff;box-shadow:inset 0 -2px 0 var(--q)}
.pulse{position:relative;isolation:isolate;border-color:var(--q);color:var(--q);font-weight:700;padding:7px 20px;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;background:rgba(14,24,48,.85)!important;box-shadow:0 0 14px rgba(var(--qr),.2);transition:color .25s,box-shadow .25s}
.pulse::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(var(--qr),.10),rgba(var(--qr),.26));transform-origin:left center;transform:scaleX(1);will-change:transform}
.pulse.cooling{color:rgba(var(--qr),.62);box-shadow:0 0 6px rgba(var(--qr),.12)}
.pulse.cooling::before{animation:charge var(--cdms,1500ms) linear forwards}
.pulse.ready-flash{animation:readyPop .35s ease-out}
@keyframes charge{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lucky-pop{position:fixed;z-index:60;pointer-events:none;font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--es);text-shadow:0 0 12px rgba(var(--esr),.8);animation:luckyUp 1s ease-out forwards;white-space:nowrap}
@keyframes luckyUp{from{opacity:1;transform:translate(-50%,-40%) scale(.9)}20%{transform:translate(-50%,-90%) scale(1.15)}to{opacity:0;transform:translate(-50%,-230%) scale(1)}}
@keyframes readyPop{40%{box-shadow:0 0 22px rgba(var(--qr),.55)}}
.pulse{width:215px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-variant-numeric:tabular-nums}
.row{--hue:195;--c:hsla(var(--hue),90%,72%,.6);display:grid;grid-template-columns:minmax(160px,1.25fr) minmax(160px,1.3fr) minmax(130px,1fr) minmax(200px,1.1fr);gap:12px;align-items:center;padding:9px 14px;margin-bottom:6px;transition:border-color .2s}
.row:hover{border-color:hsla(var(--hue),90%,70%,.35)}
.row.locked{opacity:.36;filter:saturate(.4)}
.row.clock{--c:rgba(var(--qr),.7);border-color:rgba(var(--qr),.25)}
.row .name{font-weight:650;letter-spacing:.02em}
.row .sub{font-size:12px;color:var(--dim);font-family:var(--mono)}
.row .mult{color:var(--ok);font-size:12.5px;font-family:var(--mono)}
.row .rate{font-size:12px;color:var(--dim);font-family:var(--mono)}
.row button{width:100%;font-family:var(--mono);font-size:12.5px}
.tier{display:inline-block;min-width:24px;padding:0 5px;height:20px;border-radius:2px;text-align:center;font-size:11px;line-height:20px;margin-right:9px;background:hsla(var(--hue),70%,50%,.18);color:hsl(var(--hue),95%,76%);border:1px solid hsla(var(--hue),90%,70%,.45);font-weight:700;font-family:var(--mono);box-shadow:0 0 10px hsla(var(--hue),90%,60%,.25)}
.bar10{height:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.bar10 i{display:block;height:100%;background:hsl(var(--hue),95%,70%);box-shadow:0 0 8px hsl(var(--hue),95%,65%);transition:width .2s}
h2{font-size:11.5px;margin:22px 0 9px;color:var(--dim);font-weight:700;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
.tab>h2:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.card{padding:11px 13px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s;user-select:none}
.card:hover{border-color:var(--edge2);transform:translateY(-1px)}
.card .n{font-weight:700;letter-spacing:.02em}
.card .d{color:var(--dim);font-size:12.5px;flex:1}
.card .e{color:var(--ok);font-size:12px;font-family:var(--mono)}
.card .c{font-size:12px;color:var(--faint);font-family:var(--mono)}
.card .why{font-size:12px;color:#c6b6ff;font-style:italic}
.card.can{--c:rgba(var(--qr),.9);border-color:rgba(var(--qr),.55);box-shadow:0 0 16px rgba(var(--qr),.14)}.card.can .c{color:var(--q)}
.card.sh{--c:rgba(var(--shr),.6)}.card.sh.can{--c:rgba(var(--shr),.95);border-color:rgba(var(--shr),.6);box-shadow:0 0 16px rgba(var(--shr),.16)}.card.sh.can .c{color:var(--sh)}
.card.es{--c:rgba(var(--esr),.55)}.card.es.can{--c:rgba(var(--esr),.95);border-color:rgba(var(--esr),.6);box-shadow:0 0 16px rgba(var(--esr),.16)}.card.es.can .c{color:var(--es)}
.card.bought{--c:rgba(110,242,180,.55);border-color:rgba(110,242,180,.22);cursor:default;opacity:.72}
.card.bought:hover{transform:none}
.card.bought .c{color:var(--ok)}.card.bought .c::before{content:"✓ "}
.card.rep{cursor:default}
.card .btns{display:flex;gap:6px;margin-top:5px}
.card .btns button{flex:1;padding:4px 8px;font-size:12px}
.card.draft{opacity:.5;cursor:default;border-style:dashed;animation:draft 2.4s ease-in-out infinite}
@keyframes draft{50%{opacity:.3}}
.info{padding:12px 15px;margin-bottom:12px;color:var(--dim)}
.info b{color:var(--ink)}
.hl-q{color:var(--q)!important}.hl-sh{color:var(--sh)!important}.hl-es{color:var(--es)!important}.hl-ok{color:var(--ok)!important}.hl-bad{color:var(--bad)!important}
.progress{position:fixed;bottom:0;left:0;right:0;height:38px;background:rgba(5,6,16,.94);border-top:1px solid var(--edge);z-index:10;overflow:hidden;backdrop-filter:blur(8px)}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(var(--qr),.1),rgba(var(--shr),.32));box-shadow:inset -2px 0 0 rgba(220,200,255,.8),6px 0 18px rgba(var(--shr),.35);transition:width .25s}
.progress .txt{position:relative;text-align:center;line-height:38px;font-size:12px;color:var(--dim);letter-spacing:.06em;font-family:var(--mono)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.ach{padding:9px 11px;font-size:12px;color:var(--faint);min-height:70px;--c:rgba(150,170,220,.3)}
.ach .n{font-weight:700;font-size:13px;color:var(--dim)}
.ach.got{--c:rgba(110,242,180,.75);border-color:rgba(110,242,180,.3);color:var(--dim);box-shadow:0 0 14px rgba(110,242,180,.08)}
.ach.got .n{color:var(--ok)}.ach.got .n::before{content:"★ "}
.chals{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.chal{padding:12px 15px;display:flex;flex-direction:column;gap:4px;--c:rgba(255,123,139,.45)}
.chal .n{font-weight:700;letter-spacing:.04em}
.chal .d{color:var(--dim);font-size:12.5px}
.chal .rw{color:var(--ok);font-size:12.5px}
.chal .g{color:var(--faint);font-size:12px;font-family:var(--mono)}
.chal.active{--c:rgba(255,123,139,.95);border-color:rgba(255,123,139,.5);box-shadow:0 0 18px rgba(255,123,139,.15)}
.chal button{margin-top:6px;align-self:flex-start}
table.stats{border-collapse:collapse;width:100%;max-width:720px}
table.stats td{padding:6px 18px 6px 0;border-bottom:1px solid rgba(130,160,255,.08);font-family:var(--mono);font-size:13px}
table.stats td:first-child{color:var(--dim);font-family:inherit;font-size:13.5px}
.opt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,input[type=text]{font:inherit;color:var(--ink);background:rgba(14,18,40,.9);border:1px solid var(--edge2);border-radius:3px;padding:5px 8px}
input[type=text]{width:130px;font-family:var(--mono)}
input[type=range]{accent-color:var(--q)}
label.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:rgba(14,18,40,.7);border:1px solid var(--edge);border-radius:3px;padding:6px 10px;user-select:none}
label.chk input{accent-color:var(--q)}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px;margin-bottom:6px}
.auto-box{padding:12px 15px;margin-bottom:10px}
.auto-box .opt-row{margin:8px 0 0}
#toasts{position:fixed;right:16px;bottom:52px;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:rgba(12,16,38,.94);border:1px solid var(--edge2);border-left:3px solid var(--ok);border-radius:3px;padding:8px 13px;font-size:13px;animation:tin .3s ease-out;max-width:340px;box-shadow:0 8px 26px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.toast.sh{border-left-color:var(--sh)}.toast.es{border-left-color:var(--es)}.toast.bad{border-left-color:var(--bad)}
.toast.ai{border-left-color:var(--sh);background:linear-gradient(90deg,rgba(60,40,120,.55),rgba(12,16,38,.94) 40%);color:#e4dcff}
@keyframes tin{from{transform:translateX(24px);opacity:0}}
/* the Architect speaks in a speech bubble beside its orb, bottom left; other notifications stay toasts */
#say{position:fixed;left:16px;bottom:52px;z-index:31;display:flex;align-items:flex-end;gap:12px;max-width:min(440px,calc(100vw - 400px));opacity:0;transform:translateY(14px) scale(.96);transform-origin:left bottom;transition:opacity .3s,transform .3s;pointer-events:none}
#say.on{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
#say .orb{width:34px;height:34px;margin-bottom:2px}
.say-b{position:relative;background:linear-gradient(160deg,rgba(60,40,120,.94),rgba(12,16,38,.97));border:1px solid rgba(var(--shr),.55);border-radius:14px 14px 14px 4px;padding:8px 14px 10px;font-size:13.5px;line-height:1.45;color:#e4dcff;box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 20px rgba(var(--shr),.2);backdrop-filter:blur(8px);min-width:120px}
.say-b::before{content:'';position:absolute;left:-9px;bottom:9px;width:14px;height:14px;background:rgba(48,34,104,.97);border-left:1px solid rgba(var(--shr),.55);border-bottom:1px solid rgba(var(--shr),.55);transform:rotate(45deg)}
.say-who{font-size:9.5px;letter-spacing:.22em;color:var(--sh);margin-bottom:2px}
#say.typing .say-t::after{content:'▍';opacity:.75;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.65}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(2,3,10,.74);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#modal.open{display:flex}
#modal .box{padding:20px 22px;width:min(560px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.6);background-color:rgba(12,16,38,.96)}
#modal h3{margin:0 0 10px;letter-spacing:.16em;text-transform:uppercase;font-size:14px}
#modal .mb{color:var(--dim);margin-bottom:14px}
#modal textarea{width:100%;height:150px;background:#070a1a;color:var(--ink);border:1px solid var(--edge2);border-radius:3px;font:12px/1.4 var(--mono);padding:8px;resize:vertical}
#modal .mbtns{display:flex;gap:8px;justify-content:flex-end}
.muted{color:var(--faint);font-size:12px}
.heavy-note{font-size:12.5px;color:#c6b6ff;margin:-2px 0 8px;padding:5px 10px;border-left:3px solid var(--sh);background:rgba(var(--shr),.07);border-radius:3px}
/* cards: the hand, what is working, rarity colours */
.hand{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0 10px}
.pcard{--rc:#aab2de;width:180px;min-height:250px;padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--rc);border-radius:12px;background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(9,11,30,.96) 45%),rgba(9,11,30,.95);box-shadow:0 0 18px color-mix(in srgb,var(--rc) 35%,transparent),inset 0 0 22px rgba(0,0,0,.5);animation:dealIn .45s cubic-bezier(.2,1.4,.4,1) both;transition:transform .15s,box-shadow .15s;white-space:normal;cursor:pointer}
.pcard:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 28px color-mix(in srgb,var(--rc) 60%,transparent)}
.pcard.rare{--rc:#7fe3ff}.pcard.epic{--rc:#c49bff}.pcard.legend{--rc:#ffd27a;background:linear-gradient(170deg,rgba(255,210,122,.18),rgba(9,11,30,.96) 50%)}
.pc-r{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--rc)}
.pc-g{font-size:40px;line-height:1.1;color:var(--rc);text-shadow:0 0 14px var(--rc);margin:6px 0}
.pc-n{font-weight:700;font-size:14px}
.pc-t{font-size:12.5px;color:var(--dim);flex:1}
.pc-k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rc);border:1px solid var(--rc);border-radius:20px;padding:3px 14px}
@keyframes dealIn{from{transform:translateY(30px) rotateY(80deg);opacity:0}}
.deal-wait{font-size:13px;color:var(--dim);margin:2px 0 6px}
.deal-bar{height:4px;max-width:420px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}.deal-bar i{display:block;height:100%;background:var(--sh)}
.card-active{display:flex;flex-direction:column;gap:5px}
.card-active .ca{font-size:13px;padding:6px 10px;border-left:3px solid #aab2de;background:rgba(255,255,255,.03);border-radius:3px}
.card-active .ca.rare{border-left-color:#7fe3ff}.card-active .ca.epic{border-left-color:#c49bff}.card-active .ca.legend{border-left-color:#ffd27a}

<script>
'use strict';
/* =====================================================================
   APEIRON — an infinite incremental.  Single file, no dependencies.
   ===================================================================== */

/* ---------------- Big numbers: m × 10^e, m in [1,10) ---------------- */
class D {
  constructor(m, e) { this.m = m; this.e = e; }
  static norm(m, e) {
    if (m === 0 || Number.isNaN(m)) return D.Z;
    if (!Number.isFinite(m)) return new D(m > 0 ? 1 : -1, 1e300);
    const s = Math.floor(Math.log10(Math.abs(m)));
    if (s !== 0) { m /= Math.pow(10, s); e += s; }
    const a = Math.abs(m);
    if (a >= 10) { m /= 10; e += 1; } else if (a < 1) { m *= 10; e -= 1; }
    return new D(m, e);
  }
  static fromNum(x) { return D.norm(x, 0); }
  static fromLog(L) {
    if (Number.isNaN(L) || L === -Infinity) return D.Z;
    if (L === Infinity) return new D(1, 1e300);
    let e = Math.floor(L), m = Math.pow(10, L - e);
    if (m >= 10) { m /= 10; e++; }
    return new D(m, e);
  }
  static fromStr(s) {
    s = String(s).trim().replace(/,/g, '');
    const i = s.search(/e/i);
    if (i < 0) { const n = parseFloat(s); return Number.isFinite(n) ? D.fromNum(n) : D.Z; }
    const ms = s.slice(0, i), m = ms === '' ? 1 : parseFloat(ms), e = parseFloat(s.slice(i + 1));
    if (!Number.isFinite(m) || !Number.isFinite(e)) return D.Z;
    if (Number.isInteger(e)) return D.norm(m, e);
    return m > 0 ? D.fromLog(Math.log10(m) + e) : D.Z;
  }
  static n(x) { return x instanceof D ? x : typeof x === 'number' ? D.fromNum(x) : typeof x === 'string' ? D.fromStr(x) : D.Z; }
  add(b) {
    b = D.n(b); if (this.m === 0) return b; if (b.m === 0) return this;
    const d = this.e - b.e;
    if (d > 17) return this; if (d < -17) return b;
    return d >= 0 ? D.norm(this.m + b.m * Math.pow(10, -d), this.e) : D.norm(this.m * Math.pow(10, d) + b.m, b.e);
  }
  sub(b) { b = D.n(b); return this.add(new D(-b.m, b.e)); }
  mul(b) { b = D.n(b); if (this.m === 0 || b.m === 0) return D.Z; return D.norm(this.m * b.m, this.e + b.e); }
  div(b) { b = D.n(b); if (b.m === 0) return new D(1, 1e300); if (this.m === 0) return D.Z; return D.norm(this.m / b.m, this.e - b.e); }

    b = D.n(b); const sa = Math.sign(this.m), sb = Math.sign(b.m);

    if (this.e !== b.e) return (this.e > b.e ? 1 : -1) * sa;
    return this.m === b.m ? 0 : this.m > b.m ? 1 : -1;
  }
  gt(b) { return this.cmp(b) > 0; } gte(b) { return this.cmp(b) >= 0; }
  lt(b) { return this.cmp(b) < 0; } lte(b) { return this.cmp(b) <= 0; }
  max(b) { b = D.n(b); return this.gte(b) ? this : b; }
  max0() { return this.m < 0 ? D.Z : this; }
  floor() { if (this.m === 0 || this.e >= 15) return this; return D.fromNum(Math.floor(this.toNumber() + 1e-9)); }

  toJSON() { return 'D:' + this.m + 'e' + this.e; }
}
D.Z = new D(0, 0);
const L10 = Math.log10;

/* ---------------- Formatting ---------------- */
const LOW_SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No'];
const U_SUF = ['', 'U', 'D', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'O', 'N'];
const T_SUF = ['', 'Dc', 'Vg', 'Tg', 'Qd', 'Qq', 'Sg', 'St', 'Og', 'Nn'];
const H_SUF = ['', 'Ce', 'DCe', 'TCe', 'QaCe', 'QiCe', 'SxCe', 'SpCe', 'OCe', 'NCe'];

function fmt(x, dp = 2) {
  x = D.n(x);

  if (x.m < 0) return '-' + fmt(new D(-x.m, x.e), dp);

  if (s == null || !Number.isFinite(s)) return '—';

/* ---------------- Geometric cost helpers (all in log10 space) ---------------- */

// largest n with geoSum <= money

  if (!(lm >= c0L)) return 0;
  const lr1 = L10(Math.pow(10, step) - 1), L = lm - c0L + lr1;

function unsoftcap(y, start) { return y <= start ? y : start + Math.pow(y - start, 1 / 0.85); }
function nextShardAtLog() {
  const cur = shardGain(), target = cur.add(1).log10() - shardMultLog();
  return Math.max(collapseReqLog(), CFG.collapseReq + unsoftcap(target, 40) * CFG.shardDiv);
}
function essMultLog() { return (hasE('e12') ? 2 * L10(L10(S.ascensions + 10)) : 0) + (hasE('e14') ? L10(1.5) : 0) + procSum('ess') + minorSum('ess') + fSum('ess') + cardSum('ess'); }
const canAscend = () => lq() >= CFG.limit - 1e-9;
function essenceGain() {
  if (!canAscend()) return D.Z;
  let L = essMultLog();
  if (hasE('e6')) L += softcap((lq() - CFG.limit) / CFG.ascDiv, 30);
  return D.fromLog(L).floor().max(D.fromNum(1));
}
const chalGoalLog = i => { const c = S.chal.comps[i], ch = CHALS[i]; return ch.g0 + ch.gs * c + 1.5 * c * c; };

/* =====================================================================
   ACTIONS
   ===================================================================== */
function capQ() { if (!hasE('e6') && S.q.log10() > CFG.limit) S.q = D.fromLog(CFG.limit); }

function buyGen(i, mode) {
  if (!genUnlocked(i)) return 0;
  const g = S.gens[i], lm = lq();
  let n;
  if (mode === 'max') n = genMax(i);
  else if (mode === '10') n = lm >= genCostLog(i, 10) ? 10 : 0; // exactly 10, all or nothing
  else n = lm >= genCostLog(i) ? 1 : 0;
  if (n <= 0) return 0;
  S.q = S.q.sub(D.fromLog(genCostLog(i, n))).max0();
  g.bought += n; g.amt = g.amt.add(n);
  if (i === S.gens.length - 1) S.gens.push(newGen()); // the next tier reveals itself
  aiOnBuy(i, n);
  return n;
}
function buyClock(mode) {
  if (tierBought(0) === 0) return 0; // Clock Speed speeds up generators: none yet, so it would only waste the first Quanta
  const n = mode === 'max' ? clockMax() : (lq() >= clockCostLog() ? 1 : 0);
  if (n <= 0) return 0;
  S.q = S.q.sub(D.fromLog(clockCostLog(n))).max0();
  S.clock += n; S.run.clockBought = true;

}
function maxAll() {
  let n = tierBought(0) === 0 ? buyGen(0, 'max') : 0; // never spend the first Quanta on Clock Speed
  n += buyClock('max');
  for (let i = S.gens.length - 1; i >= 0; i--) n += buyGen(i, 'max');
  return n;
}
const pulseCd = () => (S.relics.metronome ? 1000 : 1500) / (hasS('s22') ? 2 : 1) / (cardHas('pulse') ? 2 : 1) * cdMult('pulsecd'); // ms between Pulses

function buyQ(id) {

// Reshape: refund every Shard spent on the tree and restart the current run
function reshapeTree() {

  const st = webStatic('s');
  for (const id in S.minor.s) if (st.nodes[id]) refund = refund.add(D.fromLog(st.nodes[id].costLog));
  if (refund.m === 0) return false;
  for (const id in S.minor.s) if (st.nodes[id]) delete S.minor.s[id];

const repCostLog = (def, L, n = 1) => quadSumLog(L10(def.c0), L10(def.r), def.q, L, n);

function resetQLayer() {
  S.q = D.fromLog(headStartLog());
  S.gens = [newGen()];
  S.clock = 0;
  if (!hasS('s2')) { S.qUpg = {}; S.proc.q = 0; for (const u of S.forge.q) u.own = false; S.minor.q = {}; MINOR_VER++; }
  S.stats.tCollapse = 0;

}
function doCollapse(quiet = false) {

  S.shards = S.shards.add(gain); S.totalShards = S.totalShards.add(gain);
  S.collapses++; S.stats.totalCollapses++;
  if (S.stats.fastCollapse === null || t < S.stats.fastCollapse) S.stats.fastCollapse = t;
  if (t <= 30) grant('a25');

  if (tierBought(3) === 0) grantSecret('x4');
  if (runBestLog() >= 60) grantSecret('x6');

/* ---------------- Automation ---------------- */
function runAuto() {
  if (S.sUpg.abC && S.auto.clock) buyClock('max');
  for (let i = S.gens.length - 1; i >= 0; i--) {
    if (S.sUpg[i < 8 ? 'ab' + i : 'ab8'] && (i < 8 ? S.auto.gens[i] : S.auto.genHigh)) buyGen(i, 'max');
  }
  ['abL', 'abH', 'abK'].forEach((id, b) => { if (S.sUpg[id] && S.auto.qb[b]) webAutoBuy('q', 20, b); });
  if (S.sUpg.s9 && S.auto.collapse.on && S.chal.active < 0 && canCollapse()) {
    const a = S.auto.collapse, v = D.fromStr(a.val || '0');
    let go = false;
    if (a.mode === 'gain') go = shardGain().gte(v);
    else if (a.mode === 'time') go = S.stats.tCollapse >= v.toNumber();
    else go = shardGain().gte(S.shards.mul(v));

  if (S.eUpg.e8 && S.auto.ascend.on && canAscend()) {

/* =====================================================================
   SIMULATION TICK
   ===================================================================== */
function tick(dt) {

  st.time += dt; st.tCollapse += dt; st.tAscend += dt;
  if (S.eUpg.e6) st.tUnbound += dt;
  const gl = globalMultLog(), ldt = L10(dt);
  for (let i = S.gens.length - 1; i >= 1; i--) {
    const r = genRateLog(i, gl);
    if (r > -Infinity) S.gens[i - 1].amt = S.gens[i - 1].amt.add(D.fromLog(r + ldt));
  }
  const ql = qpsLog(gl);
  if (ql > -Infinity) { const g = D.fromLog(ql + ldt); S.q = S.q.add(g); st.totalQ = st.totalQ.add(g); }
  capQ();
  if (S.q.gt(st.bestQ)) st.bestQ = S.q;
  if (S.run.best === undefined || lq() > S.run.best) S.run.best = lq();
  const Hh = S.hist;
  if (st.time >= Hh.next) {
    Hh.t.push(Math.round(st.time)); Hh.q.push(+Math.max(0, lq()).toFixed(2)); Hh.best.push(+Math.max(0, st.bestQ.log10()).toFixed(2));
    Hh.sh.push(S.shards.m > 0 ? +Math.max(0, S.shards.log10()).toFixed(2) : 0); Hh.es.push(S.essence.m > 0 ? +Math.max(0, S.essence.log10()).toFixed(2) : 0);
    if (Hh.t.length > 600) { for (const k of ['t', 'q', 'best', 'sh', 'es']) Hh[k] = Hh[k].filter((_, i) => i % 2 === 0); Hh.every *= 2; }
    Hh.next = st.time + Hh.every;
  }
  if (hasE('e7')) {
    const g = shardGain();
    if (g.m > 0) { const add = g.mul(0.1 * dt); S.shards = S.shards.add(add); S.totalShards = S.totalShards.add(add); }
  }
  if (canCollapse()) S.reached.collapse = true;
  if (canAscend()) S.reached.limit = true;
  if (S.chal.active >= 0 && lq() >= chalGoalLog(S.chal.active)) completeChal();
  runAuto();
  aiTick();
  cardsTick();
  checkAch();
}
/* =====================================================================

const cardSum = k => { let s = 0; for (const c of S.cards.active) if (c.k === k) s += c.v; return s; };
const cardHas = k => S.cards.active.some(c => c.k === k);
function dealCards() {
  const hand = [], used = new Set(), s = cardScale();
  for (let n = 0; n < 3; n++) {
    let tot = 0; const pool = [];
    for (const k in CARD_KINDS) { const d = CARD_KINDS[k]; if (used.has(k) || (d.req && !d.req())) continue; pool.push(k); tot += d.w; }
    let r = Math.random() * tot, k = pool[0];
    for (const x of pool) { r -= CARD_KINDS[x].w; if (r <= 0) { k = x; break; } }
    used.add(k);

    const d = CARD_KINDS[k], p = RARITY[ri].p * (0.85 + 0.3 * Math.random()); // each card rolls a little up or down
    hand.push({ k, r: ri, v: d.val(p, s), dur: d.dur === undefined ? 0 : d.dur, name: rnd(d.names), id: ++S.cards.seq });
  }
  S.cards.hand = hand;
  aiSay(rnd(['I drew three cards for you. Keep one.', 'Your hand is dealt. Choose.', 'Three cards, one choice. The others go back in the deck.', 'Fortune is a kind of Quanta too. Pick a card.']));
}
function keepCard(i) {
  const hand = S.cards.hand; if (!hand || !hand[i]) return false;
  const c = hand[i], d = CARD_KINDS[c.k], t = S.stats.time;
  S.cards.hand = null; S.cards.next = t + DEAL_EVERY; S.cards.drawn++; S.cards.by[c.r]++;
  if (c.k === 'time') { const p = qpsLog(); if (p > -Infinity) { S.q = S.q.add(D.fromLog(p + L10(c.v))); capQ(); } }
  else if (c.k === 'abil') { S.abil.surge.ready = 0; S.abil.fold.ready = 0; }
  else if (c.k === 'gamble') {
    if (Math.random() < 0.5) { S.cards.active.push({ k: 'qmult', v: c.v, dur: 600, until: t + 600, name: c.name + ' (heads)', r: c.r }); aiSay('Heads. Enjoy it.'); }
    else aiSay(rnd(['Tails. The deck owes you one.', 'Tails. Nothing this time.']));
  }
  else S.cards.active.push({ k: c.k, v: c.v, dur: c.dur, until: c.dur < 0 ? -1 : t + c.dur, name: c.name, r: c.r });
  if (c.r === 3) grant('a43');
  return true;
}
function cardsTick() {
  const C = S.cards, t = S.stats.time;
  if (C.active.length && C.active.some(c => c.until >= 0 && c.until <= t)) C.active = C.active.filter(c => c.until < 0 || c.until > t);
  if (!C.hand && cardsOn() && t >= C.next) dealCards();

function simulate(total, maxTicks = 2000) {
  const n = Math.min(maxTicks, Math.max(1, Math.ceil(total / 0.05))), step = total / n;
  SIMULATING = true;
  try { for (let i = 0; i < n; i++) tick(step); } finally { SIMULATING = false; }
}

const SAVE_KEY = 'apeiron.save.v1';
const reviver = (k, v) => typeof v === 'string' && v.startsWith('D:') ? D.fromStr(v.slice(2)) : v;
function merge(def, sav) {
  if (def === null || def === undefined) return sav;
  if (sav === undefined || sav === null) return def;
  if (def instanceof D) return sav instanceof D ? sav : D.n(sav);
  if (Array.isArray(def)) {
    if (!Array.isArray(sav)) return def;
    const len = Math.max(def.length, sav.length);
    return Array.from({ length: len }, (_, i) => i < sav.length ? merge(def[i] !== undefined ? def[i] : def[0], sav[i]) : def[i]);
  }
  if (typeof def === 'object') {
    if (typeof sav !== 'object') return def;
    const out = {};
    for (const k of Object.keys(def)) out[k] = merge(def[k], sav[k]);
    for (const k of Object.keys(sav)) if (!(k in out)) out[k] = sav[k];
    return out;
  }
  return typeof sav === typeof def ? sav : def;
}

    if (c === '&') { const j = html.indexOf(';', i); out += html.slice(i, j + 1); i = j + 1; count++; continue; }

  const plain = plainOf(html), total = plain.length;
  let n = 0, timer = null, done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(timer); el.innerHTML = html; if (orb) orb.classList.remove('talk'); if (onDone) onDone(); };

    if (done) return;

    const ch = plain[n - 1] || '';

    timer = setTimeout(step, /[.!?…]/.test(ch) ? 280 : /[,;:—]/.test(ch) ? 140 : speed);

}

function startStars() {
  const c = $('stars'), g = c.getContext('2d');
  let W = 0, H = 0, stars = [], last = 0;
  const resize = () => {
    const d = window.devicePixelRatio || 1;
    W = c.width = Math.floor(innerWidth * d); H = c.height = Math.floor(innerHeight * d);
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 4500) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), p: Math.random() * 6.28, hue: Math.random() < 0.15 ? 270 : Math.random() < 0.3 ? 190 : 225 }));
  };
  resize(); addEventListener('resize', resize);
  const draw = ts => {
    requestAnimationFrame(draw);
    if (ts - last < 33 || document.body.classList.contains('nostars')) return;
    const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
    const d = window.devicePixelRatio || 1;
    g.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.y -= (3 + s.z * 12) * dt * d; if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
      s.p += dt * (0.6 + s.z * 1.4);
      const a = 0.15 + 0.6 * s.z * (0.55 + 0.45 * Math.sin(s.p)), r = (0.5 + s.z * 1.3) * d;
      g.fillStyle = `hsla(${s.hue},90%,${80 + s.z * 15}%,${a})`;
      g.fillRect(s.x, s.y, r, r);
    }
  };
  requestAnimationFrame(draw);
}

function buildStatsGraph(T) {
  const SER = [['best', 'Best Quanta', '--q', []], ['q', 'Quanta now', '--dim', [4, 4]], ['sh', 'Shards', '--sh', []], ['es', 'Essence', '--es', []]];
  const on = { best: true, q: true, sh: true, es: true };
  const css = v => getComputedStyle(document.body).getPropertyValue(v).trim() || '#888';
  const legend = h('div', { class: 'opt-row' });
  for (const [k, label, col, dash] of SER) {
    const sw = h('span', { class: 'gsw' }); const b = h('button', { class: 'gleg on', onclick: () => { on[k] = !on[k]; setC(b, 'on', on[k]); key = ''; } }, sw, label);
    up(() => { sw.style.borderTopColor = css(col); sw.style.borderTopStyle = dash.length ? 'dashed' : 'solid'; }, 'stats'); legend.append(b);
  }
  const box = h('div', { class: 'graphbox' }), cv = h('canvas'), tip = h('div', { class: 'gtip' });
  box.append(cv, tip);
  T.append(h('h2', {}, 'Progress over time'), legend, box);
  let key = '', hx = null;
  function draw() {
    const Hh = S.hist, n = Hh.t.length, dpr = window.devicePixelRatio || 1, Wd = box.clientWidth, Hd = 300;
    if (!Wd) return;
    cv.width = Wd * dpr; cv.height = Hd * dpr; cv.style.width = Wd + 'px'; cv.style.height = Hd + 'px';
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, Wd, Hd);
    const L = 58, R = 14, Tp = 14, B = 30, pw = Wd - L - R, ph = Hd - Tp - B;
    g.font = '11px ' + (getComputedStyle(document.body).fontFamily || 'sans-serif');
    if (n < 2) { g.fillStyle = css('--faint'); g.fillText('Play a little longer: a point is recorded every ' + Hh.every + ' seconds.', L, Tp + ph / 2); tip.style.display = 'none'; return; }
    const tMax = Math.max(1, Hh.t[n - 1]);
    let yMax = 10; for (const [k] of SER) if (on[k]) for (const v of Hh[k]) if (v > yMax) yMax = v;
    const stepY = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 1e4, 2e4, 5e4, 1e5].find(s => yMax / s <= 5) || Math.pow(10, Math.ceil(L10(yMax / 5)));
    yMax = Math.ceil(yMax / stepY) * stepY;
    const X = t => L + t / tMax * pw, Y = v => Tp + ph - v / yMax * ph;
    g.strokeStyle = 'rgba(130,160,255,.10)'; g.lineWidth = 1; g.fillStyle = css('--faint'); g.textAlign = 'right';
    for (let v = 0; v <= yMax + 1e-9; v += stepY) { const y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.fillText(v === 0 ? '1' : '1e' + v, L - 6, y + 4); }
    const stepT = [60, 300, 600, 1800, 3600, 7200, 14400, 28800, 86400, 172800, 604800].find(s => tMax / s <= 8) || 604800;
    g.textAlign = 'center';
    for (let s = 0; s <= tMax; s += stepT) g.fillText(s < 3600 ? Math.round(s / 60) + 'm' : s < 86400 ? (s / 3600).toFixed(s % 3600 ? 1 : 0) + 'h' : (s / 86400).toFixed(1) + 'd', X(s), Tp + ph + 18);
    for (const [k, , col, dash] of SER) {
      if (!on[k]) continue;
      g.strokeStyle = css(col); g.lineWidth = k === 'best' ? 2 : 1.5; g.setLineDash(dash); g.lineJoin = 'round'; g.beginPath();
      Hh[k].forEach((v, i) => { const x = X(Hh.t[i]), y = Y(v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke(); g.setLineDash([]);
    }
    if (hx !== null && hx >= L && hx <= L + pw) {
      const tt = (hx - L) / pw * tMax; let bi = 0; for (let i = 0; i < n; i++) if (Math.abs(Hh.t[i] - tt) < Math.abs(Hh.t[bi] - tt)) bi = i;
      const x = X(Hh.t[bi]); g.strokeStyle = 'rgba(200,210,255,.35)'; g.beginPath(); g.moveTo(x, Tp); g.lineTo(x, Tp + ph); g.stroke();
      tip.innerHTML = '<b>' + fmtTime(Hh.t[bi]) + ' played</b>' + SER.filter(s => on[s[0]]).map(s => `<div>${s[1]}: ${Hh[s[0]][bi] > 0 ? '1e' + Hh[s[0]][bi].toFixed(1) : '0'}</div>`).join('');
      tip.style.display = 'block'; tip.style.left = Math.min(Wd - 170, x + 12) + 'px';
    } else tip.style.display = 'none';
  }
  cv.addEventListener('pointermove', e => { hx = e.offsetX; draw(); });
  cv.addEventListener('pointerdown', e => { hx = e.offsetX; draw(); });
  cv.addEventListener('pointerleave', () => { hx = null; draw(); });
  up(() => { const k = S.hist.t.length + '|' + S.settings.ui.theme + '|' + box.clientWidth + '|' + JSON.stringify(on); if (k !== key) { key = k; draw(); } }, 'stats');
}

  T.append(h('h2', {}, 'Sound and story'), h('div', { class: 'opt-row' }, chk('Architect voice', 'sound'), h('span', {}, 'Volume'), vol, h('button', { onclick: () => { blip(1.15); } }, 'Test')),
    h('div', { class: 'opt-row' }, chk('UI sounds', 'sfx'), h('span', {}, 'Volume'), sfxVol, h('button', { onclick: () => { sfx('upgrade'); } }, 'Test'), h('button', { onclick: playIntro }, 'Replay intro'), h('button', { onclick: () => { S.tut = { step: 0, off: false }; setTab('gen'); } }, 'Restart tutorial')));
  T.append(h('h2', {}, 'Saving'),
    h('div', { class: 'opt-row' }, chk('Autosave every 10s', 'autosave'), chk('Offline progress', 'offline')),
    h('div', { class: 'opt-row' },

  T.append(h('h2', {}, 'About'), h('div', { class: 'info', html: '<b>Apeiron</b> (Greek: the boundless) — an infinite incremental. Numbers are stored as mantissa × 10<sup>exponent</sup>, so they can grow far past 1e308 (to about 10<sup>10<sup>308</sup></sup>). Saves live in this browser\'s local storage; export to keep a backup.' }));
}

/* ---------------- Progress bar ---------------- */
function buildProgress() {
  const fill = $('pfill'), txt = $('ptxt');
  up(() => {
    const L = Math.max(0, lq());
    let goal, label;
    if (S.chal.active >= 0) { goal = chalGoalLog(S.chal.active); label = CHALS[S.chal.active].name + ' goal'; }
    else if (L < collapseReqLog()) { goal = collapseReqLog(); label = 'Collapse'; }
    else if (!hasE('e6')) { goal = CFG.limit; label = 'the Limit'; }
    else { const k = Math.floor((L - CFG.limit) / CFG.ascDiv) + 1; goal = CFG.limit + k * CFG.ascDiv; label = 'next ×10 Essence'; }
    const p = Math.max(0, Math.min(1, L / goal));
    fill.style.width = (p * 100).toFixed(2) + '%';
    setT(txt, `${(p * 100).toFixed(1)}% to ${label} (${fmt(D.fromLog(goal))} Quanta)`);
  });
}

/* ---------------- Render ---------------- */
function render(force) {
  R = { gl: globalMultLog(), res: resonance() };
  R.qps = qpsLog(R.gl); R.sg = shardGain();
  const tab = S.settings.tab;
  for (const [fn, t] of UI.ups) if (!t || t === tab) fn();
}

/* ---------------- Input ---------------- */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  if ($('modal').classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key.toLowerCase();
  if (!e.repeat && ['m', 'p', 't', 'c', 'a', 's', 'f'].includes(k)) sfx('click');
  if (k === 'm') sfx(maxAll() ? 'buy' : 'fail');
  else if (k === 'p') sfx(pulse() ? 'pulse' : 'fail');
  else if (k === 't') sfx(buyClock(S.settings.buyMode === 'max' ? 'max' : '1') ? 'buy' : 'fail');
  else if (k === 'c') { if (!doCollapse()) sfx('fail'); }
  else if (k === 'a') { if (!doAscend()) sfx('fail'); }
  else if (k === 's') sfx(useAbility('surge') ? 'upgrade' : 'fail');
  else if (k === 'f') sfx(useAbility('fold') ? 'buy' : 'fail');
  else return;
  render(true);
});
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
// every button, card, toggle and menu clicks down and clacks back up like a mechanical key
const CLICKY = 'button, .card, label.chk, select, .orb.poke, input[type=range], .tn';
let pressedEl = null;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const el = e.target.closest(CLICKY); if (!el || el.closest('#intro')) return;
  const dead = el.disabled || el.classList.contains('bought') || el.classList.contains('draft');
  pressedEl = el; sfx(dead ? 'dud' : 'press');
}, true);
document.addEventListener('pointerup', () => { if (pressedEl) { const el = pressedEl; pressedEl = null; if (!el.disabled && !el.classList.contains('bought') && !el.classList.contains('draft')) sfx('release'); } }, true);
for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, () => { if (S) S.ai.lastInput = S.stats.time; }, true);

/* ---------------- Main loop ---------------- */
let paused = false, lastRender = 0, lastSave = Date.now();
function frame() {
  const now = Date.now();
  const dt = (now - S.last) / 1000; S.last = now;
  const inIntro = $('intro').classList.contains('open'); // the world waits while the Architect talks
  if (!paused && !inIntro && dt > 0) { if (dt > 0.5) simulate(dt); else tick(dt); }
  if (S.settings.tab === 'guide' && dt > 0 && dt < 1) { S.secret.guide += dt; if (S.secret.guide >= 60) grantSecret('x8'); }
  if (now - lastRender > 90) { render(); lastRender = now; }
  if (S.settings.autosave && now - lastSave > 10000) { save(); lastSave = now; }
}

function init() {
  S = newState();
  let away = 0;
  try {
    const raw = NOSAVE ? null : localStorage.getItem(SAVE_KEY);
    if (raw) { S = loadFrom(raw); away = (Date.now() - S.last) / 1000; }
  } catch (e) { console.warn('Save could not be loaded', e); S = newState(); }
  buildHeader(); buildNav(); buildGenTab(); buildArchTab(); buildUpgTab(); buildShardTab(); buildAutoTab(); buildAscTab(); buildCardsTab(); buildChalTab(); buildAchTab(); buildStatsTab(); buildGuideTab(); buildOptTab(); buildProgress();
  if (away > 10 && S.settings.offline) {
    const q0 = S.q, s0 = S.shards, e0 = S.essence, c0 = S.stats.totalCollapses, a0 = S.ascensions;
    simulate(away, 4000);
    const parts = [`Quanta: ${fmt(q0)} → <b class="hl-q">${fmt(S.q)}</b>`];
    if (S.shards.gt(s0) || S.stats.totalCollapses > c0) parts.push(`Shards: ${fmt(s0.floor(), 0)} → <b class="hl-sh">${fmt(S.shards.floor(), 0)}</b> (${S.stats.totalCollapses - c0} collapses)`);
    if (S.ascensions > a0) parts.push(`Essence: ${fmt(e0.floor(), 0)} → <b class="hl-es">${fmt(S.essence.floor(), 0)}</b> (${S.ascensions - a0} ascensions)`);
    modal('Welcome back', h('div', { html: `You were away for <b>${fmtTime(away)}</b>.<br><br>` + parts.join('<br>') }), [['Continue', () => true]]);
  }
  S.last = Date.now();
  S.ai.lastInput = S.stats.time;
  // older saves: ideas were bought in order; Automata I/II became individual autobuyers
  for (const l of ['q', 's', 'e']) S.forge[l].forEach((u, i) => { if (u.own === undefined) u.own = i < S.proc[l]; });
  if (S.sUpg.s4) { for (const id of ['ab0', 'ab1', 'ab2', 'ab3', 'abC']) S.sUpg[id] = true; delete S.sUpg.s4; }
  if (S.sUpg.s6) { for (const id of ['ab4', 'ab5', 'ab6', 'ab7', 'ab8', 'abL', 'abH', 'abK']) S.sUpg[id] = true; delete S.sUpg.s6; }
  // Quanta ideas became cheaper and weaker: re-value the ones already written; ideas now spread over their branch
  if (S.forgeVer !== FORGE_VER) { for (const u of S.forge.q) u.v = forgeValue('q', u.kind, u.n); for (const l of ['q', 's', 'e']) respreadIdeas(l); S.forgeVer = FORGE_VER; PROC_AGG = {}; }
  applyUI();
  if (!S.introSeen) playIntro();
  setTab(TABS.some(t => t[0] === S.settings.tab) ? S.settings.tab : 'gen');
  setInterval(frame, 50);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); }); // phones often close apps without unloading
  // work offline once visited (only on the real site; not on local test servers or the Android app)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  startStars();
}
