plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.titanthegodlike.apeiron'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.titanthegodlike.apeiron'
        minSdk 24
        targetSdk 34
        // GitHub Actions passes its run number, so every new build is an update
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.${project.findProperty('versionCode') ?: '0'}"
    }

    // One fixed key for every build, so a new APK installs over the old one
    // (and keeps the save). A fresh CI runner would otherwise sign each build
    // with a new random debug key, and Android refuses that as an update.
    // This is a debug key with the standard public debug passwords, not a secret.
    signingConfigs {
        debug {
            storeFile file('apeiron-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
