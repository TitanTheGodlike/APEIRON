name: Android APK

# Builds the Android app from the current game (index.html, css/, js/) and publishes it as
# Apeiron.apk on the "latest" release, every time the game changes on main.
on:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'icon-192.png', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the game into the app
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res/mipmap-xxxhdpi
          cp index.html android/app/src/main/assets/index.html
          cp -r css js android/app/src/main/assets/
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build the APK
        run: gradle -p android assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Publish Apeiron.apk on the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Apeiron.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Apeiron for Android" --notes "The newest version of the game as an Android app. Download Apeiron.apk on your phone and open it; Android will ask you to allow installing apps from your browser the first time."
          gh release upload latest Apeiron.apk --clobber
